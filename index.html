<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remanga Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Remanga Game</h1>
    <p>Войди или зарегистрируйся</p>
    <input type="text" id="loginInput" placeholder="Логин">
    <input type="password" id="passwordInput" placeholder="Пароль">
    <button class="auth-btn-login" onclick="doLogin()">Войти</button>
    <button class="auth-btn-register" onclick="doRegister()">Зарегистрироваться</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar" id="topbar" style="display:none;">
  <div class="user-info">
    <div class="user-avatar">🫪</div>
    <div>
      <div class="user-name">ооо</div>
      <div class="user-rank">ранг</div>
    </div>
  </div>
  <div class="resources">
    <div class="res-item res-energy"><span class="icon"></span> <span id="resEnergy">80</span> / <span id="resMaxEnergy">80</span></div>
    <div class="res-item res-silver"><span class="icon">🪙</span> <span id="resSilver">1553</span></div>
  </div>
</div>

<!-- Кнопка раскрытия меню под аватаркой -->
<div class="user-menu-toggle" id="userMenuToggle" style="display:none;">
  <div class="res-item res-menu-btn" onclick="toggleUserMenu()">
    <span class="icon">👜</span>
  </div>
</div>

<!-- Выпадающее меню -->
<div class="user-menu" id="userMenu">
  <div class="res-item res-inventory" onclick="openInventory(); toggleUserMenu()">
    <span class="icon">👜</span> Инвентарь
  </div>
  <div class="res-item res-quests" onclick="openQuests(); toggleUserMenu()">
    <span class="icon">📋</span> Задания
  </div>
  <div class="res-item res-gifts" onclick="openGifts(); toggleUserMenu()">
    <span class="icon">🎁</span> Дары
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: ИНВЕНТАРЬ -->
<div class="modal-page-overlay" id="inventoryModal">
  <div class="modal-page">
    <button class="modal-page-close" onclick="closeInventory()">✕</button>
    <h2>👜 ИНВЕНТАРЬ</h2>
    <div class="modal-page-content">
      <p>Здесь будет твой инвентарь</p>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: ЗАДАНИЯ -->
<div class="modal-page-overlay" id="questsModal">
  <div class="modal-page">
    <button class="modal-page-close" onclick="closeQuests()">✕</button>
    <h2>📋 ЗАДАНИЯ</h2>
    <div class="modal-page-content">
      <p>Здесь будут твои задания</p>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: ДАРЫ -->
<div class="modal-page-overlay" id="giftsModal">
  <div class="modal-page">
    <button class="modal-page-close" onclick="closeGifts()">✕</button>
    <h2>🎁 ДАРЫ</h2>
    <div class="modal-page-content">
      <p>Здесь будут твои дары</p>
    </div>
  </div>
</div>

<!-- NAV BAR (BOTTOM) -->
<div class="nav-bar" id="navBar" style="display:none;">
  <div class="nav-item active" data-page="map" onclick="switchPage('map')">
    <div class="nav-icon">️</div>
    <div class="nav-label">Карта</div>
  </div>
  <div class="nav-item" data-page="deck" onclick="switchPage('deck')">
    <div class="nav-icon"></div>
    <div class="nav-label">Колода</div>
  </div>
  <div class="nav-item" data-page="bazar" onclick="switchPage('bazar')">
    <div class="nav-icon">🏪</div>
    <div class="nav-label">Базар</div>
  </div>
  <div class="nav-item" data-page="duel" onclick="switchPage('duel')">
    <div class="nav-icon">⚔️</div>
    <div class="nav-label">Дуэль</div>
  </div>
  <div class="nav-item" data-page="top" onclick="switchPage('top')">
    <div class="nav-icon">🏆</div>
    <div class="nav-label">Топ</div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="page-map" class="page active">
  <div class="map-container" id="mapContainer"></div>
</div>

<div id="page-deck" class="page">
  <div class="deck-page" id="deckPage"></div>
</div>

<div id="page-bazar" class="page">
  <div class="bazar-page" id="bazarPage"></div>
</div>

<div id="page-duel" class="page">
  <div class="placeholder-page">
    <div class="ph-icon">️</div>
    <div class="ph-text">Дуэль</div>
  </div>
</div>

<div id="page-top" class="page">
  <div class="placeholder-page">
    <div class="ph-icon"></div>
    <div class="ph-text">Топ игроков</div>
  </div>
</div>

<!-- LOCATION MODAL -->
<div class="modal-overlay" id="locModal">
  <div class="modal-content" id="locModalContent"></div>
</div>

<!-- CARD MODAL -->
<div class="modal-overlay" id="cardModal">
  <div class="modal-content" id="cardModalContent"></div>
</div>

<!-- BANNER MODAL -->
<div class="modal-overlay" id="bannerModal">
  <div class="modal-content" id="bannerModalContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>
